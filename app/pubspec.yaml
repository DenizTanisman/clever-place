name: clever_place
description: "Clever Place: a brain-games collection with a Rust core."
publish_to: "none"
version: 1.1.0+3

environment:
  # Color.withValues() (used in the theme/widgets) requires Flutter 3.27 / Dart 3.6+.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations
  shared_preferences: ^2.3.2 # persist locale, theme and progress
  url_launcher: ^6.3.1 # source links in Küp Defteri
  ffi: ^2.2.0
  flutter_svg: ^2.3.2
  webview_flutter: ^4.14.1 # offline 3D algorithm player in Küp Defteri (assets/cube/player/)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true # build AppLocalizations from lib/l10n/*.arb
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/CormorantGaramond-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/Jost-Medium.ttf
          weight: 500
        - asset: assets/fonts/Jost-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700
  assets:
    - assets/cube/ # stored scrambles with their analysis, Küp Defteri, Tek El Planı 
    - assets/cube/player/ # offline 3D algorithm player (WebView page, three.js r128)

# App launcher + adaptive icons. Masters are generated by test/app_icon_gen_test.dart.
# iOS master is opaque (filled to the corners); Android uses an adaptive fg + solid bg colour.
flutter_launcher_icons:
  image_path: "assets/icon/icon_ios.png"
  android: true
  ios: false
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
